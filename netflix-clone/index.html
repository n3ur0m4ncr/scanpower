<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">MyFlix</div>
        <nav class="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Series</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">My List</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to MyFlix</h1>
            <p>Stream your favorite movies and shows</p>
        </section>
        <section class="row">
            <h2>Popular</h2>
            <div class="row-posters">
                <img src="https://placehold.co/200x300" alt="Movie 1" class="poster">
                <img src="https://placehold.co/200x300" alt="Movie 2" class="poster">
                <img src="https://placehold.co/200x300" alt="Movie 3" class="poster">
                <img src="https://placehold.co/200x300" alt="Movie 4" class="poster">
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
